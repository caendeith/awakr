name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests, lint and debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      # The wrapper and the dependency mirrors are pinned in the repository
      # (gradle/wrapper/gradle-wrapper.properties, settings.gradle.kts), so CI
      # resolves exactly the same artifacts as a local build.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Windows checkouts frequently lose the executable bit; harmless on Linux runners.
      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Lint (aborts on error, HardcodedText is an error)
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Assert the APK has no INTERNET permission
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)"
          PERMISSIONS="$("${BUILD_TOOLS}/aapt2" dump permissions app/build/outputs/apk/debug/app-debug.apk)"
          echo "${PERMISSIONS}"
          if grep -q 'android.permission.INTERNET' <<< "${PERMISSIONS}"; then
            echo "::error::INTERNET permission is not allowed in Awakr"
            exit 1
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: awakr-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
